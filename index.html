<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#02091c">

    <title>රහල් රසෝඝය 2026</title>

    <!-- Sinhala Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="background">

        <div class="background-image"></div>

        <div class="background-overlay"></div>

        <div class="blue-glow glow-1"></div>
        <div class="blue-glow glow-2"></div>
        <div class="gold-glow"></div>

    </div>


    <!-- =====================================================
         DECORATIVE PARTICLES
         ===================================================== -->

    <div class="particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- =====================================================
         FLOATING MUSIC / ART SYMBOLS
         ===================================================== -->

    <div class="floating-symbol symbol-1">♪</div>
    <div class="floating-symbol symbol-2">♫</div>
    <div class="floating-symbol symbol-3">✦</div>
    <div class="floating-symbol symbol-4">♬</div>


    <!-- =====================================================
         MAIN WELCOME SCREEN
         ===================================================== -->

    <main class="welcome-screen">


        <!-- =================================================
             TOP BRAND
             ================================================= -->

        <header class="top-header">

            <div class="line"></div>

            <div class="school-name">
                ශ්‍රී රාහුල
            </div>

            <div class="line right"></div>

        </header>


        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <section class="content">


            <div class="welcome-label">

                <span class="label-line"></span>

                WELCOME TO

                <span class="label-line"></span>

            </div>


            <!-- =================================================
                 EVENT TITLE
                 ================================================= -->

            <h1>

                <span class="event-title">
                    රහල් රසෝඝය
                </span>

                <span class="event-year">
                    2026
                </span>

            </h1>


            <div class="subtitle">

                ශ්‍රී රාහුල කලා මංගල්‍යය

            </div>


            <!-- =================================================
                 GOLD DECORATION
                 ================================================= -->

            <div class="ornament">

                <span></span>

                <i>✦</i>

                <span></span>

            </div>


            <!-- =================================================
                 WELCOME MESSAGE
                 ================================================= -->

            <h2>
                ඔබ සැම සාදරයෙන් පිළිගනිමු
            </h2>


            <p class="message">

                කලාවේ සුන්දරත්වය,
                සංගීතයේ මිහිරියාව හා
                නර්තනයේ රිද්මය සමඟින්
                සොඳුරු මතකයන් එක් කරගන්න.

            </p>


            <!-- =================================================
                 EVENT INFO
                 ================================================= -->

            <div class="event-info">


                <!-- DATE -->

                <div class="info-item">

                    <div class="info-icon">
                        23
                    </div>

                    <div class="info-text">

                        <small>
                            දිනය
                        </small>

                        <strong>
                            ඔක්තෝබර් 2026
                        </strong>

                    </div>

                </div>


                <div class="info-divider"></div>


                <!-- TIME -->

                <div class="info-item">

                    <div class="info-icon clock">
                        09
                    </div>

                    <div class="info-text">

                        <small>
                            ආරම්භය
                        </small>

                        <strong>
                            පෙ.ව. 09.00
                        </strong>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 CULTURAL CATEGORIES
                 ================================================= -->

            <div class="categories">

                <div class="category">

                    <span class="category-icon">
                        🎭
                    </span>

                    <span>
                        DRAMA
                    </span>

                </div>


                <div class="category-dot">
                    ✦
                </div>


                <div class="category">

                    <span class="category-icon">
                        🎵
                    </span>

                    <span>
                        MUSIC
                    </span>

                </div>


                <div class="category-dot">
                    ✦
                </div>


                <div class="category">

                    <span class="category-icon">
                        💃
                    </span>

                    <span>
                        DANCE
                    </span>

                </div>

            </div>


            <!-- =================================================
                 CTA
                 ================================================= -->

                <button
                class="welcome-button"
                id="welcomeButton"
            >

                <span>
                    උත්සවයට පිවිසෙන්න
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


        </section>


        <!-- =================================================
             BOTTOM
             ================================================= -->

        <footer class="bottom">

            <div class="bottom-line"></div>

            <span>
                RAHAL RASOGHAYA
            </span>

            <span class="star">
                ✦
            </span>

            <span>
                2026
            </span>

            <div class="bottom-line"></div>

        </footer>


    </main>


    <script src="script.js"></script>

</body>

</html>
